# ============================================================================
#  Konfigurasi Nginx (reverse proxy) untuk VPS Hostinger.
#  Meneruskan subdomain ke aplikasi Node.js yang berjalan di localhost.
#
#  Cara pakai (lihat DEPLOY-HOSTINGER.md untuk lengkapnya):
#     sudo cp deploy/nginx-coclean.conf /etc/nginx/sites-available/coclean.conf
#     sudo ln -s /etc/nginx/sites-available/coclean.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx   # pasang HTTPS gratis (Let's Encrypt)
#
#  GANTI "laundry.contohdomain.com" dengan subdomain asli milikmu.
# ============================================================================

# ---- Dashboard laundry (port 3000) ----
server {
    listen 80;
    server_name laundry.contohdomain.com;

    # Izinkan upload sampai 30MB (screenshot & file transaksi .xlsx).
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Pemrosesan AI (analisa gambar) bisa lama — beri timeout longgar.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
    }
}


<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Dashboard Kas Laundry</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #17697b, #0f5260 70%, #0b4753);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Arial, sans-serif; color: #1d3338;
      padding: 16px;
    }
    .box {
      background: #fff; width: 360px; max-width: 92vw; padding: 32px 28px;
      border-radius: 20px; box-shadow: 0 20px 56px rgba(8, 45, 52, 0.32);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .brand span {
      font-size: 26px; color: #fff; background: #17697b;
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
    }
    .brand img.logo {
      width: 50px; height: 50px; border-radius: 50%;
      object-fit: contain; background: #f3eedf; padding: 3px; flex: 0 0 auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
    }
    .brand h1 { font-size: 19px; margin: 0; font-weight: 800; color: #0f5260; }
    p.sub { margin: 6px 0 20px; font-size: 13.5px; color: #5e7072; }
    label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; color: #5e7072; }
    input {
      width: 100%; padding: 12px 13px; font-size: 14.5px; border: 1.5px solid #e7ddc9;
      border-radius: 12px;
    }
    input:focus { outline: none; border-color: #17697b; box-shadow: 0 0 0 3px rgba(23,105,123,0.16); }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 14px;
      background: linear-gradient(180deg, #1f8294, #17697b); color: #fff; font-size: 15.5px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(23,105,123,0.3);
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: .6; cursor: wait; }
    .err { margin-top: 14px; color: #cf463a; font-size: 13.5px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="box" id="login-form">
    <div class="brand">
      <img class="logo" src="/logo.jpeg" alt="Logo Co Clean Laundry"
        onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'),{textContent:'◍'}))" />
      <h1>Dashboard Kas Laundry</h1>
    </div>
    <p class="sub">Masuk untuk melanjutkan</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" />
    <button type="submit" id="btn">Masuk</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById("login-form");
    const err = document.getElementById("err");
    const btn = document.getElementById("btn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("u").value,
            password: document.getElementById("p").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          window.location = "/";
        } else {
          err.textContent = data.error || "Username atau password salah.";
        }
      } catch (e2) {
        err.textContent = "Gagal terhubung ke server.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
